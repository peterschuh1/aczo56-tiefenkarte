<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Interaktive Tiefenkarte Vereinsweiher</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#ffffff;color:#183126;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:10px}
.controls{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:nowrap;
  margin-bottom:9px;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.controls::-webkit-scrollbar{display:none}
button{
  min-height:40px;
  flex:1 1 0;
  min-width:0;
  white-space:nowrap;
  padding:8px 9px;
  border:1px solid #cad6d0;
  border-radius:10px;
  background:#f4f7f6;
  color:#14231b;
  font:700 13px Arial;
  cursor:pointer;
}
button.on{background:#176d3d;color:white;border-color:#176d3d}
#viewer{position:relative;width:100%;height:720px;max-height:78vh;min-height:440px;border-radius:16px;overflow:hidden;background:#eef7fb;touch-action:none}
#viewer canvas{display:block;width:100%;height:100%}
.badge{position:absolute;left:10px;bottom:10px;z-index:4;background:rgba(5,12,15,.74);color:#fff;padding:7px 9px;border-radius:9px;font-size:12px;line-height:1.25;pointer-events:none}
.legend{
  position:absolute;
  right:8px;
  top:8px;
  z-index:4;
  background:rgba(255,255,255,.90);
  border:1px solid rgba(36,75,42,.20);
  border-radius:9px;
  padding:6px 6px;
  width:58px;
  color:#1f3327;
  font-size:9px;
  pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.legend-scale{
  display:grid;
  grid-template-columns:12px 1fr;
  gap:5px;
  align-items:stretch;
}
.grad{
  height:112px;
  width:10px;
  border-radius:6px;
  background:linear-gradient(to bottom,#c51f26,#e9542b,#f49b35,#f3d65c,#b7dfdf,#6aa7e8,#356cd2,#173da6,#26106d)
}
.legend-ticks{
  height:112px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-align:left;
  white-space:nowrap;
  font-weight:700;
}
.depth-tip{position:absolute;z-index:5;display:none;pointer-events:none;background:rgba(4,10,13,.9);color:white;border-radius:8px;padding:6px 8px;font-size:12px;transform:translate(10px,10px)}
.note{margin-top:8px;color:#53665d;font-size:13px;line-height:1.45}
@media(max-width:650px){
 .wrap{padding:4px}
 .controls{gap:3px;margin-bottom:5px;overflow:visible}
 button{
   min-height:36px;
   padding:6px 4px;
   font-size:10.5px;
   letter-spacing:-.15px;
   border-radius:8px;
 }
 #viewer{
   height:560px;
   height:72svh;
   min-height:430px;
   max-height:none;
   border-radius:10px;
   touch-action:none;
 }
 .legend{right:5px;top:5px;transform:scale(.88);transform-origin:top right}
 .badge{left:5px;bottom:5px;font-size:9px;max-width:74%}
 .note{font-size:11px;line-height:1.35;margin-top:5px}
}

@media print{
  @page{size:landscape;margin:10mm}
  html,body{
    background:#fff !important;
    color:#111 !important;
  }
  .wrap{
    max-width:none !important;
    width:100% !important;
    padding:0 !important;
    margin:0 !important;
  }
  .controls,
  .note,
  .depth-tip{
    display:none !important;
  }
  #viewer{
    width:100% !important;
    height:185mm !important;
    max-height:none !important;
    min-height:0 !important;
    border-radius:0 !important;
    overflow:hidden !important;
    background:#fff !important;
    page-break-inside:avoid;
  }
  #viewer canvas{
    width:100% !important;
    height:100% !important;
    display:block !important;
  }
  .badge{
    display:block !important;
    left:8px !important;
    bottom:8px !important;
    color:#111 !important;
    background:rgba(255,255,255,.82) !important;
    border:1px solid #ccc !important;
  }
  .legend{
    display:block !important;
    color:#111 !important;
    background:rgba(255,255,255,.88) !important;
    border:1px solid #ccc !important;
  }
}


@media(max-width:430px){
  .controls{gap:2px}
  button{
    font-size:9.6px;
    padding:5px 2px;
    min-height:34px;
  }
}


.runtime-error{
  display:none;
  position:absolute;
  left:10px;
  right:10px;
  top:58px;
  z-index:20;
  padding:12px;
  border-radius:10px;
  background:#fff2f2;
  border:1px solid #d99;
  color:#7d1e1e;
  font-size:13px;
  line-height:1.4;
}


.dpad{
    grid-template-columns:34px 34px 34px;
    grid-template-rows:34px 34px 34px;
  }
  .camera-pad button{
    min-width:34px;width:34px;height:34px;min-height:34px;
    font-size:16px;border-radius:9px
  }
  .zoom-row{grid-template-columns:34px 52px 34px}
  .zoom-row button{width:34px}
  .zoom-row .top-btn{width:52px;font-size:11px}
}


.control-hint{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  z-index:7;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(36,75,42,.16);
  color:#365040;
  font-size:10px;
  line-height:1;
  white-space:nowrap;
  pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
}
@media(max-width:650px){
  .control-hint{
    font-size:9px;
    padding:4px 7px;
    bottom:6px;
  }
}


.depth-pin-label{
  position:absolute;
  z-index:12;
  display:none;
  pointer-events:none;
  transform:translate(-50%,-135%);
  background:rgba(20,42,31,.94);
  color:#fff;
  border-radius:8px;
  padding:5px 7px;
  font-size:11px;
  font-weight:800;
  line-height:1;
  white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.22);
}
.depth-pin-label::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-5px;
  transform:translateX(-50%);
  border-left:5px solid transparent;
  border-right:5px solid transparent;
  border-top:5px solid rgba(20,42,31,.94);
}
@media(max-width:650px){
  .depth-pin-label{
    font-size:10px;
    padding:4px 6px;
    border-radius:7px;
  }
}

</style>

function depthColor(d){
 const stops=[
  [0,[197,31,38]],[.08,[233,84,43]],[.18,[244,155,53]],[.28,[243,214,92]],
  [.40,[183,223,223]],[.55,[106,167,232]],[.72,[53,108,210]],[.88,[23,61,166]],[1,[38,16,109]]
 ];
 let t=Math.max(0,Math.min(1,d/D.maxDepth));
 for(let i=1;i<stops.length;i++){
  if(t<=stops[i][0]){
   const a=stops[i-1],b=stops[i],q=(t-a[0])/(b[0]-a[0]);
   return new THREE.Color((a[1][0]+q*(b[1][0]-a[1][0]))/255,(a[1][1]+q*(b[1][1]-a[1][1]))/255,(a[1][2]+q*(b[1][2]-a[1][2]))/255);
  }
 }
 return new THREE.Color(38/255,16/255,109/255);
}

const pondPos=[], pondCol=[], pondIdx=[], pondDepth=[];
const vertMap=Array.from({length:D.nrows},()=>Array(D.ncols).fill(-1));
for(let r=0;r<D.nrows;r++){
 for(let c=0;c<D.ncols;c++){
  const d=D.z[r][c];
  if(d==null) continue;
  const x=c/(D.ncols-1)*D.pondW-D.pondW/2;
  const y=(D.nrows-1-r)/(D.nrows-1)*D.pondH-D.pondH/2;
  const idx=pondDepth.length;
  vertMap[r][c]=idx; pondDepth.push(d);
  pondPos.push(x,y,-d);
  const col=depthColor(d); pondCol.push(col.r,col.g,col.b);
 }
}
for(let r=0;r<D.nrows-1;r++){
 for(let c=0;c<D.ncols-1;c++){
  const a=vertMap[r][c],b=vertMap[r][c+1],cc=vertMap[r+1][c],d=vertMap[r+1][c+1];
  if(a>=0&&b>=0&&cc>=0) pondIdx.push(a,cc,b);
  if(b>=0&&cc>=0&&d>=0) pondIdx.push(b,cc,d);
 }
}
const pondGeo=new THREE.BufferGeometry();
pondGeo.setAttribute('position',new THREE.Float32BufferAttribute(pondPos,3));
pondGeo.setAttribute('color',new THREE.Float32BufferAttribute(pondCol,3));
pondGeo.setIndex(pondIdx);

// Präziser Luftbild-Untergrund:
// Ein einziges Satellitenbild, aber der Weiher wird per Alpha-Maske exakt ausgespart.
// Dadurch bleibt die Tiefenkarte sichtbar, ohne die groben weißen Nähte der alten Geometrie.
const groundGeo=new THREE.PlaneGeometry(D.sceneW,D.sceneH,1,1);

// Maske als Canvas-Textur aufbauen.
// Schwarz = Luftbild sichtbar, Weiß = Weiher transparent.
const maskCanvas=document.createElement('canvas');
maskCanvas.width=D.ncols;
maskCanvas.height=D.nrows;
const mctx=maskCanvas.getContext('2d');
const imgData=mctx.createImageData(D.ncols,D.nrows);

for(let r=0;r<D.nrows;r++){
  for(let c=0;c<D.ncols;c++){
    const idx=(r*D.ncols+c)*4;
    const water=D.mask[r][c] ? 255 : 0;
    imgData.data[idx]=water;
    imgData.data[idx+1]=water;
    imgData.data[idx+2]=water;
    imgData.data[idx+3]=255;
  }
}
mctx.putImageData(imgData,0,0);

const maskTex=new THREE.CanvasTexture(maskCanvas);
maskTex.minFilter=THREE.LinearFilter;
maskTex.magFilter=THREE.LinearFilter;
maskTex.flipY=false;

const satUniforms={
 mapTex:{value:null},
 maskTex:{value:maskTex},
 hasMap:{value:0.0},
 pondU0:{value:D.margin/D.sceneW},
 pondV0:{value:D.margin/D.sceneH},
 pondUS:{value:D.pondW/D.sceneW},
 pondVS:{value:D.pondH/D.sceneH}
};

const satMat=new THREE.ShaderMaterial({
  transparent:true,
  depthWrite:true,
  side:THREE.DoubleSide,
  uniforms:satUniforms,
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,
  fragmentShader:`
    uniform sampler2D mapTex;
    uniform sampler2D maskTex;
    uniform float hasMap;
    uniform float pondU0;
    uniform float pondV0;
    uniform float pondUS;
    uniform float pondVS;
    varying vec2 vUv;

    void main(){
      vec3 col=vec3(0.62,0.67,0.63);
      if(hasMap>0.5){
        col=texture2D(mapTex,vUv).rgb;
        // Luftbild bewusst aufhellen: Gamma + leichte Helligkeits-/Kontrastkorrektur.
        col=pow(col,vec3(0.82));
        col=(col-0.5)*1.04+0.5;
        col*=1.13;
        col=clamp(col,0.0,1.0);
      }

      float alpha=1.0;

      // Nur innerhalb des tatsächlichen ReefMaster-Rechtecks die Weihermaske prüfen.
      if(vUv.x>=pondU0 && vUv.x<=pondU0+pondUS &&
         vUv.y>=pondV0 && vUv.y<=pondV0+pondVS){
        vec2 puv=vec2(
          (vUv.x-pondU0)/pondUS,
          1.0-(vUv.y-pondV0)/pondVS
        );
        float water=texture2D(maskTex,puv).r;

        // Weiche, aber sehr schmale Uferkante. Die Tiefenkarte bleibt vollständig sichtbar.
        alpha=1.0-smoothstep(0.30,0.72,water);
      }

      if(alpha<0.02) discard;
      gl_FragColor=vec4(col,alpha);
    }
  `
});

     const g=ctx.createRadialGradient(128,128,8,128,128,124);
     g.addColorStop(0,'rgba(255,255,235,1)');
     g.addColorStop(.18,'rgba(255,241,166,.98)');
     g.addColorStop(.45,'rgba(255,210,90,.62)');
     g.addColorStop(1,'rgba(255,205,70,0)');
     ctx.fillStyle=g; ctx.fillRect(0,0,256,256);
     const t=new THREE.CanvasTexture(c);
     t.encoding=THREE.sRGBEncoding;
     return t;
   })(),
   transparent:true,
   depthWrite:false,
   blending:THREE.AdditiveBlending
 })
);
sunDisc.position.copy(sun.position);
sunDisc.scale.set(28,28,1);
scene.add(sunDisc);

// Wenige stilisierte, halbtransparente Wolken hoch über der Karte.
const cloudGroup=new THREE.Group();
scene.add(cloudGroup);
const cloudMat=new THREE.MeshBasicMaterial({
 color:0xffffff,transparent:true,opacity:.58,depthWrite:false
});
function addCloud(x,y,z,s){
 const g=new THREE.Group();
 const parts=[
  [-1.1,0,0,.9],[0,0,.12,1.15],[1.05,.05,0,.82],
  [-.45,.15,.42,.75],[.48,.12,.38,.68]
 ];
 for(const p of parts){
   const m=new THREE.Mesh(new THREE.SphereGeometry(s*p[3],16,10),cloudMat);
   m.scale.z=.42; m.position.set(s*p[0],s*p[1],s*p[2]); g.add(m);
 }
 g.position.set(x,y,z); cloudGroup.add(g);
}
addCloud(-D.sceneW*.40,D.sceneH*.24,42,7);
addCloud(D.sceneW*.34,D.sceneH*.34,48,6);
addCloud(D.sceneW*.18,-D.sceneH*.40,55,5.5);

// Bewegte, transparente Wasseroberfläche auf Höhe 0.
// Sie liegt nur innerhalb der ReefMaster-Gewässermaske.
const waterGeo=new THREE.BufferGeometry();
const wp=[], wi=[];
const wmap=Array.from({length:D.nrows},()=>Array(D.ncols).fill(-1));
let wcount=0;

for(let r=0;r<D.nrows;r++){
 for(let c=0;c<D.ncols;c++){
   if(!D.mask[r][c]) continue;
   const x=c/(D.ncols-1)*D.pondW-D.pondW/2;
   const y=(D.nrows-1-r)/(D.nrows-1)*D.pondH-D.pondH/2;
   wmap[r][c]=wcount++;
   wp.push(x,y,0.10);
 }
}

for(let r=0;r<D.nrows-1;r++){
 for(let c=0;c<D.ncols-1;c++){
   const a=wmap[r][c],b=wmap[r][c+1],cc=wmap[r+1][c],d=wmap[r+1][c+1];
   if(a>=0&&b>=0&&cc>=0) wi.push(a,cc,b);
   if(b>=0&&cc>=0&&d>=0) wi.push(b,cc,d);
 }
}

waterGeo.setAttribute('position',new THREE.Float32BufferAttribute(wp,3));
waterGeo.setIndex(wi);
waterGeo.computeVertexNormals();

const waterUniforms={
 time:{value:0},
 opacity:{value:0.30},
 deepColor:{value:new THREE.Color(0x2f91c9)},
 lightColor:{value:new THREE.Color(0xaee7ff)},
 cameraPos:{value:new THREE.Vector3()}
};

const waterMat=new THREE.ShaderMaterial({
 transparent:true,
 depthWrite:false,
 side:THREE.DoubleSide,
 uniforms:waterUniforms,
 vertexShader:`
   uniform float time;
   varying vec3 vWorldPos;
   varying float vWave;

   void main(){
     vec3 p=position;

     float w1=sin(p.x*0.20 + time*1.55);
     float w2=sin(p.y*0.27 - time*1.28);
     float w3=sin((p.x+p.y)*0.115 + time*0.92);
     float w4=sin((p.x-p.y)*0.38 - time*1.82);

     float wave=(w1*0.38 + w2*0.29 + w3*0.20 + w4*0.13);
     p.z += wave*0.16;

     vec4 world=modelMatrix*vec4(p,1.0);
     vWorldPos=world.xyz;
     vWave=wave;

     gl_Position=projectionMatrix*viewMatrix*world;
   }
 `,
 fragmentShader:`
   uniform float opacity;
   uniform vec3 deepColor;
   uniform vec3 lightColor;
   uniform vec3 cameraPos;

   varying vec3 vWorldPos;
   varying float vWave;

   void main(){
     vec3 viewDir=normalize(cameraPos-vWorldPos);
     float fresnel=pow(1.0-abs(viewDir.z),2.0);
     float shimmer=0.5+0.5*vWave;

     // Deutlich sichtbarer Wassercharakter mit hellen Wellenreflexen.
     float sparkle=pow(max(shimmer,0.0),7.0);
     vec3 color=mix(deepColor,lightColor,0.16 + fresnel*0.30 + sparkle*0.10);

     float alpha=opacity + fresnel*0.08 + sparkle*0.03;
     gl_FragColor=vec4(color,clamp(alpha,0.0,0.46));
   }
 `
});

const waterSurface=new THREE.Mesh(waterGeo,waterMat);
waterSurface.visible=false;
waterSurface.renderOrder=4;
scene.add(waterSurface);

let waterVisible=false;


function refreshPinnedPointHeight(){
  if(!depthPinGroup.visible) return;

  // Von oben auf dieselbe XY-Position auf das aktuelle Tiefenmesh raycasten.
  const origin=new THREE.Vector3(depthPinGroup.position.x,depthPinGroup.position.y,50);
  const down=new THREE.Vector3(0,0,-1);
  const r=new THREE.Raycaster(origin,down,0,100);
  const hit=r.intersectObject(pond,false)[0];
  if(hit){
    const d=Math.max(0,-hit.point.z/exaggeration);
    pinnedDepth=d;
    depthPinGroup.position.z=hit.point.z+0.08;
    depthPinLabel.textContent=d.toFixed(2)+' m';
  }
}

function updateDepthScale(){
 const pos=pond.geometry.attributes.position;
 for(let i=0;i<pondDepth.length;i++) pos.setZ(i,-pondDepth[i]*exaggeration);
 pos.needsUpdate=true;
 pond.geometry.computeVertexNormals();

 contourGroup.children.forEach(line=>{
   const p=line.geometry.attributes.position,lev=line.userData.level;
   for(let i=0;i<p.count;i++) p.setZ(i,-lev*exaggeration+.035);
   p.needsUpdate=true;
 });

 refreshPinnedPointHeight();
}

 is2D=false;

// ---------------- Standort ----------------
// Die ReefMaster-ASC-Datei ist georeferenziert. Dadurch kann GPS direkt
// in lokale X/Y-Koordinaten des 3D-Modells umgerechnet werden.
const GEO={
  lon0:6.5765673811,
  lat0:49.7093775598,
  lon1:6.5783559362,
  lat1:49.7105560651
};

let locationWatchId=null;
let locationVisible=false;

const locationGroup=new THREE.Group();
locationGroup.visible=false;
locationGroup.renderOrder=10;
scene.add(locationGroup);

// Blauer Standortpunkt
const locDot=new THREE.Mesh(
  new THREE.SphereGeometry(0.95,24,16),
  new THREE.MeshPhongMaterial({
    color:0x1677ff,
    emissive:0x0b3e8a,
    emissiveIntensity:.25,
    shininess:80
  })
);
locDot.position.z=1.0;
locationGroup.add(locDot);

// Heller Ring um den Standortpunkt
const locRing=new THREE.Mesh(
  new THREE.RingGeometry(1.5,2.15,48),
  new THREE.MeshBasicMaterial({
    color:0xffffff,
    transparent:true,
    opacity:.95,
    side:THREE.DoubleSide,
    depthWrite:false
  })
);
locRing.position.z=.97;
locationGroup.add(locRing);

// Genauigkeitskreis
const accMat=new THREE.MeshBasicMaterial({
  color:0x2f8cff,
  transparent:true,
  opacity:.16,
  side:THREE.DoubleSide,
  depthWrite:false
});
const accGeo=new THREE.CircleGeometry(1,64);
const accuracyCircle=new THREE.Mesh(accGeo,accMat);
accuracyCircle.position.z=.15;
locationGroup.add(accuracyCircle);

function gpsToModel(lon,lat){
  const u=(lon-GEO.lon0)/(GEO.lon1-GEO.lon0);
  const v=(lat-GEO.lat0)/(GEO.lat1-GEO.lat0);

  return {
    x:u*D.pondW-D.pondW/2,
    y:v*D.pondH-D.pondH/2,
    inside:(u>=0 && u<=1 && v>=0 && v<=1)
  };
}

function showLocationStatus(text,error=false){
  locStatus.textContent=text;
  locStatus.style.display='block';
  locStatus.style.background=error ? 'rgba(130,24,24,.90)' : 'rgba(4,43,84,.88)';
}

function hideLocationStatus(){
  locStatus.style.display='none';
}

function updateLocationButton(){
  locBtn.classList.toggle('on',locationVisible);
  locBtn.textContent=locationVisible ? '📍 Aus' : '📍 Ort';
}

function startLocation(){
  if(!navigator.geolocation){
    showLocationStatus('Standort ist hier nicht verfügbar. Auf der späteren HTTPS-Webseite funktioniert die GPS-Freigabe.',true);
    return;
  }

  showLocationStatus('📍 Standort wird ermittelt …');
  locationVisible=true;
  updateLocationButton();

  locationWatchId=navigator.geolocation.watchPosition(
    pos=>{
      const lat=pos.coords.latitude;
      const lon=pos.coords.longitude;
      const accuracy=Math.max(1,pos.coords.accuracy || 1);
      const p=gpsToModel(lon,lat);

      locationGroup.position.set(p.x,p.y,0);
      accuracyCircle.scale.set(accuracy,accuracy,1);
      locationGroup.visible=true;

      if(p.inside){
        showLocationStatus('📍 Standort · Genauigkeit ±'+Math.round(accuracy)+' m');
      }else{
        showLocationStatus('📍 Standort außerhalb des dargestellten Weiherbereichs · ±'+Math.round(accuracy)+' m');
      }

      // Nach erfolgreicher Positionsbestimmung Hinweis nach kurzer Zeit dezent ausblenden.
      clearTimeout(window.__locStatusTimer);
      window.__locStatusTimer=setTimeout(()=>hideLocationStatus(),4500);
    },
    err=>{
      let msg='Standort konnte nicht bestimmt werden.';
      if(err.code===1) msg='Standortfreigabe wurde nicht erlaubt.';
      if(err.code===2) msg='Standort ist momentan nicht verfügbar.';
      if(err.code===3) msg='Standortbestimmung hat zu lange gedauert.';
      showLocationStatus('📍 '+msg,true);
      locationGroup.visible=false;
      locationVisible=false;
      updateLocationButton();
      if(locationWatchId!==null){
        navigator.geolocation.clearWatch(locationWatchId);
        locationWatchId=null;
      }
    },
    {
      enableHighAccuracy:true,
      maximumAge:1500,
      timeout:12000
    }
  );
}

function stopLocation(){
  if(locationWatchId!==null){
    navigator.geolocation.clearWatch(locationWatchId);
    locationWatchId=null;
  }
  locationVisible=false;
  locationGroup.visible=false;
  hideLocationStatus();
  updateLocationButton();
}

locBtn.onclick=()=>{
  if(locationVisible) stopLocation();
  else startLocation();
};



// ---------------- Tiefen-Pin für Touch ----------------
// Mobil: einmal antippen = kleiner Pin an dieser Stelle mit Tiefenangabe.
// Nächster Tipp versetzt den Pin. Desktop-Hover bleibt zusätzlich erhalten.
const depthPinLabel=document.getElementById('depthPinLabel');

const depthPinGroup=new THREE.Group();
depthPinGroup.visible=false;
depthPinGroup.renderOrder=20;
scene.add(depthPinGroup);

const pinStem=new THREE.Mesh(
  new THREE.CylinderGeometry(0.07,0.07,0.85,10),
  new THREE.MeshBasicMaterial({color:0x173b2a})
);
pinStem.rotation.x=Math.PI/2;
pinStem.position.z=0.52;
depthPinGroup.add(pinStem);

const pinHead=new THREE.Mesh(
  new THREE.SphereGeometry(0.22,18,12),
  new THREE.MeshPhongMaterial({
    color:0xf4c84a,
    emissive:0x5d4a00,
    emissiveIntensity:.20,
    shininess:55
  })
);
pinHead.position.z=0.98;
depthPinGroup.add(pinHead);

const pinTip=new THREE.Mesh(
  new THREE.ConeGeometry(0.12,0.34,12),
  new THREE.MeshBasicMaterial({color:0x173b2a})
);
pinTip.rotation.x=Math.PI;
pinTip.position.z=0.17;
depthPinGroup.add(pinTip);

let pinnedDepth=null;

function raycastPondFromClient(clientX,clientY){
  const rect=renderer.domElement.getBoundingClientRect();
  mouse.x=(clientX-rect.left)/rect.width*2-1;
  mouse.y=-(clientY-rect.top)/rect.height*2+1;
  ray.setFromCamera(mouse,camera);
  return ray.intersectObject(pond,false)[0] || null;
}

function placeDepthPin(clientX,clientY){
  const hit=raycastPondFromClient(clientX,clientY);
  if(!hit) return false;

  const d=Math.max(0,-hit.point.z/exaggeration);
  pinnedDepth=d;

  // Pin knapp über die angeklickte Bodenoberfläche setzen.
  depthPinGroup.position.set(hit.point.x,hit.point.y,hit.point.z+0.08);
  depthPinGroup.visible=true;

  depthPinLabel.textContent=d.toFixed(2)+' m';
  depthPinLabel.style.display='block';
  updateDepthPinLabel();

  return true;
}

function updateDepthPinLabel(){
  if(!depthPinGroup.visible) return;

  const p=depthPinGroup.position.clone();
  p.z += 1.15;
  p.project(camera);

  const rect=renderer.domElement.getBoundingClientRect();
  const x=(p.x*.5+.5)*rect.width;
  const y=(-p.y*.5+.5)*rect.height;

  depthPinLabel.style.left=x+'px';
  depthPinLabel.style.top=y+'px';
}

// Auf Touch-Geräten reicht ein einzelnes Antippen.
// Der Pin bleibt stehen, während die Karte anschließend gedreht oder gezoomt wird.
renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'){
    placeDepthPin(e.clientX,e.clientY);
  }
});

// Desktop: Klick setzt ebenfalls einen dauerhaften Pin,
// Hover-Anzeige bleibt zusätzlich bestehen.
renderer.domElement.addEventListener('click',e=>{
  if(e.pointerType!=='touch'){
    placeDepthPin(e.clientX,e.clientY);
  }
});


const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2();
renderer.domElement.addEventListener('pointermove',e=>{
 // Auf Touch-Geräten keine flackernde Hover-Anzeige.
 // Dort übernimmt der dauerhafte Tiefen-Pin die Anzeige.
 if(e.pointerType==='touch') return;

 const rect=renderer.domElement.getBoundingClientRect();
 const hit=raycastPondFromClient(e.clientX,e.clientY);

 if(hit){
  const d=Math.max(0,-hit.point.z/exaggeration);
  tip.textContent='Tiefe: '+d.toFixed(2)+' m';
  tip.style.display='block';
  tip.style.left=(e.clientX-rect.left)+'px';
  tip.style.top=(e.clientY-rect.top)+'px';
 }else{
  tip.style.display='none';
 }
});

function resize(){
 const w=host.clientWidth,h=host.clientHeight;
 renderer.setSize(w,h,false);
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,180));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',resize);
}
resize();
set3D();
waterUniforms.cameraPos.value.copy(camera.position);
updateButtons();
setTimeout(function(){
  resize();
  set3D();
},180);

const clock=new THREE.Clock();

(function loop(){
 requestAnimationFrame(loop);

 const dt=clock.getDelta();
 if(waterVisible){
   waterUniforms.time.value += dt;
   waterUniforms.cameraPos.value.copy(camera.position);
 }

 if(locationGroup.visible){
   const dist=camera.position.distanceTo(locationGroup.position);
   const s=Math.max(.55,Math.min(2.4,dist/95));
   locDot.scale.setScalar(s);
   locRing.scale.setScalar(s);
 }

 if(depthPinGroup.visible){
   const dist=camera.position.distanceTo(depthPinGroup.position);
   const s=Math.max(.65,Math.min(1.8,dist/110));
   depthPinGroup.scale.setScalar(s);
   updateDepthPinLabel();
 }

 controls.update();
 renderer.render(scene,camera);
})();
</script>
